name: Repo Arbiter (GitHub App)

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-arbiter
  queue: max

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPO_ARBITER_APP_ID }}
          private-key: ${{ secrets.REPO_ARBITER_APP_PRIVATE_KEY }}

      - name: Run Repo Arbiter
        uses: deerwan/repo-arbiter@v0.1.3
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: 'true'
        env:
          ARBITER_LLM_API_KEY: ${{ secrets.ARBITER_LLM_API_KEY }}
          ARBITER_LLM_PROVIDER: openai
          ARBITER_LLM_MODEL: gpt-4o-mini
