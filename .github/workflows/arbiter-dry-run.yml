name: Arbiter Dry Run

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to analyze
        required: true
        type: string
      dry-run:
        description: Preview only, do not write to GitHub
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Repo Arbiter
        uses: ./
        with:
          dry-run: ${{ inputs.dry-run }}
          issue-number: ${{ inputs.issue-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARBITER_LLM_API_KEY: ${{ secrets.ARBITER_LLM_API_KEY }}
          ARBITER_LLM_BASE_URL: ${{ secrets.ARBITER_LLM_BASE_URL }}
          ARBITER_LLM_MODEL: ${{ secrets.ARBITER_LLM_MODEL }}
          ARBITER_LLM_PROVIDER: openai
