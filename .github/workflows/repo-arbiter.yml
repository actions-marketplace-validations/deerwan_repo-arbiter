name: Repo Arbiter

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue number to analyze
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repo-arbiter-${{ github.event.issue.number || inputs.issue-number }}
  queue: max

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot'
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPO_ARBITER_APP_ID }}
          private-key: ${{ secrets.REPO_ARBITER_APP_PRIVATE_KEY }}

      - name: Run Repo Arbiter
        uses: deerwan/repo-arbiter@v0.1.5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          bot-login: ${{ vars.REPO_ARBITER_BOT_LOGIN }}
          dry-run: 'false'
          issue-number: ${{ inputs.issue-number }}
        env:
          ARBITER_LLM_API_KEY: ${{ secrets.ARBITER_LLM_API_KEY }}
          ARBITER_LLM_BASE_URL: ${{ secrets.ARBITER_LLM_BASE_URL }}
          ARBITER_LLM_MODEL: ${{ secrets.ARBITER_LLM_MODEL }}
          ARBITER_LLM_PROVIDER: openai
